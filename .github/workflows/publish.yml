name: Publish NuGet package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Trusted Publishing: without it GitHub will not issue the
      # OIDC token and the NuGet/login step fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/uCodeFirst/uCodeFirst.csproj

      - name: Build
        run: dotnet build src/uCodeFirst/uCodeFirst.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/uCodeFirst/uCodeFirst.csproj --configuration Release --no-build --output ./artifacts

      # Exchanges the GitHub OIDC token for a NuGet API key valid for 1 hour.
      # Authorised by the Trusted Publishing policy on nuget.org, which is bound
      # to owner + repo + this workflow file name. No long-lived secret exists.
      - name: NuGet login (OIDC → short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org PROFILE NAME, not an email address.
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

name: Publish NuGet package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/uCodeFirst/uCodeFirst.csproj

      - name: Build
        run: dotnet build src/uCodeFirst/uCodeFirst.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/uCodeFirst/uCodeFirst.csproj --configuration Release --no-build --output ./artifacts

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
